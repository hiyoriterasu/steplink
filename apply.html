<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>審査お申し込み | Step Link</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-slate-50 text-slate-800 font-sans leading-relaxed selection:bg-emerald-500 selection:text-white">

  <!-- ヘッダー -->
  <header class="bg-white/95 backdrop-blur-md shadow-sm sticky top-0 z-50 border-b border-slate-100">
    <div class="max-w-4xl mx-auto px-4 h-16 flex items-center justify-between">
      <a href="index.html" class="flex items-center gap-2">
        <span class="text-2xl font-black text-slate-900 tracking-tight">Step<span class="text-emerald-500">Link</span></span>
      </a>
    </div>
  </header>

  <main class="max-w-3xl mx-auto px-4 py-12">
    <div class="text-center mb-10">
      <h1 class="text-2xl md:text-3xl font-black text-slate-900 mb-3">審査お申し込みフォーム</h1>
      <p class="text-slate-600 text-sm">以下の規約をご確認の上、お申し込みへお進みください。</p>
    </div>

    <div class="bg-white p-6 md:p-10 rounded-3xl shadow-sm border border-slate-200">
      
      <!-- ステップ1：規約への同意エリア（HTML側で制御） -->
      <div id="agreementSection" class="mb-8">
        <h2 class="text-lg font-bold text-slate-800 border-b-2 border-emerald-500 pb-2 mb-4">1. 利用規約への同意</h2>
        <p class="text-sm text-slate-600 mb-4 leading-relaxed">
          お申し込みを進めるには、当店の利用規約およびプライバシーポリシーへの同意が必要です。必ず以下のリンク先をご確認ください。
        </p>
        
        <div class="bg-slate-50 p-5 rounded-xl border border-slate-200 mb-6">
          <ul class="space-y-3 mb-6">
            <li>
              <a href="https://terraso01.github.io/steplink/terms.html" target="_blank" class="flex items-center gap-2 text-emerald-600 hover:text-emerald-700 font-bold text-sm md:text-base hover:underline transition">
                <i class="fas fa-external-link-alt"></i> 重要事項説明書・割賦販売利用規約
              </a>
            </li>
            <li>
              <a href="https://terraso01.github.io/steplink/privacy.html" target="_blank" class="flex items-center gap-2 text-emerald-600 hover:text-emerald-700 font-bold text-sm md:text-base hover:underline transition">
                <i class="fas fa-external-link-alt"></i> 個人情報保護方針
              </a>
            </li>
          </ul>

          <label class="flex items-start gap-3 cursor-pointer group">
            <div class="relative flex items-center justify-center mt-0.5">
              <input type="checkbox" id="agreeCheckbox" class="peer appearance-none w-6 h-6 border-2 border-slate-300 rounded focus:ring-2 focus:ring-emerald-200 checked:bg-emerald-500 checked:border-emerald-500 transition cursor-pointer">
              <i class="fas fa-check absolute text-white text-sm opacity-0 peer-checked:opacity-100 pointer-events-none"></i>
            </div>
            <div class="text-base font-bold text-slate-800 leading-tight">
              上記の規約と方針を確認し、内容に同意します。
            </div>
          </label>
        </div>
      </div>

      <!-- ステップ2：Googleフォーム（初期状態は隠れている） -->
      <div id="googleFormSection" class="hidden opacity-0 transition-opacity duration-500 ease-in-out">
        <h2 class="text-lg font-bold text-slate-800 border-b-2 border-emerald-500 pb-2 mb-4">2. お客様情報の入力</h2>
        
        <!-- ▼ iframeの src="..." をご自身のGoogleフォームのURLに書き換えてください ▼ -->
        <div class="w-full relative rounded-xl overflow-hidden bg-slate-50" style="height: 800px;">
          <!-- スピナー（読み込み中） -->
          <div class="absolute inset-0 flex items-center justify-center text-slate-400">
            <i class="fas fa-spinner fa-spin text-3xl"></i>
          </div>
          <!-- フォーム本体 -->
          <iframe 
            src="<iframe src="https://docs.google.com/forms/d/e/1FAIpQLSdA91UxG_tY4QXqxZFkY4BPRbnh2ra7MhVj5w6BcGjZT3MmsQ/viewform?embedded=true" width="640" height="3645" frameborder="0" marginheight="0" marginwidth="0">読み込んでいます…</iframe>" 
            width="100%" 
            height="100%" 
            frameborder="0" 
            marginheight="0" 
            marginwidth="0"
            class="relative z-10">
            読み込み中…
          </iframe>
        </div>
      </div>

    </div>
  </main>

  <script>
    // チェックボックスのON/OFFでGoogleフォームの表示を切り替えるスクリプト
    const checkbox = document.getElementById('agreeCheckbox');
    const formSection = document.getElementById('googleFormSection');

    checkbox.addEventListener('change', function() {
      if (this.checked) {
        // チェックされたらフォームを表示
        formSection.classList.remove('hidden');
        // 少し遅らせてフェードインさせる
        setTimeout(() => {
          formSection.classList.remove('opacity-0');
          formSection.classList.add('opacity-100');
        }, 50);
      } else {
        // チェックが外れたらフォームを隠す
        formSection.classList.remove('opacity-100');
        formSection.classList.add('opacity-0');
        setTimeout(() => {
          formSection.classList.add('hidden');
        }, 500);
      }
    });
  </script>

</body>
</html>
